<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartFilco — RGB</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;
justify-content:center;align-items:center;gap:2rem;padding:2rem;
background:#12110f;color:#e8e3da;
font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
#sw{width:min(58vw,260px);aspect-ratio:1;border-radius:18px;
border:1px solid #33302b;transition:background .15s linear}
.ch{display:grid;grid-template-columns:1.2rem 3ch 1fr;gap:.55rem .7rem;
align-items:center;width:min(80vw,320px)}
.ch b{font-weight:500;color:#8a8175}
.ch i{font-style:normal;text-align:right;font-size:1.05rem}
.t{height:6px;background:#1e1c19;border-radius:3px;overflow:hidden}
.t>div{height:100%;border-radius:3px;transition:width .15s linear}
.sub{color:#8a8175;font-size:.75rem;letter-spacing:.04em}
.dim{display:grid;grid-template-columns:1fr 7ch;gap:.8rem;align-items:center;
width:min(80vw,320px)}
.dim input{width:100%;accent-color:#e8e3da}
.dim span{color:#8a8175;font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
</style></head><body>
<div id="sw"></div>
<div class="ch">
<b>R</b><i id="vr">-</i><div class="t"><div id="br" style="background:#d4553f"></div></div>
<b>G</b><i id="vg">-</i><div class="t"><div id="bg" style="background:#6b8e5a"></div></div>
<b>B</b><i id="vb">-</i><div class="t"><div id="bb" style="background:#5a7d9e"></div></div>
</div>
<div class="dim">
<input id="sl" type="range" min="0" max="80" value="80" aria-label="brilho">
<span id="pct">-</span>
</div>
<div class="sub" id="meta">carregando...</div>
<script>
var tNum=0, tMexeu=0, ws=null, vmax=80;

function rotulo(v){return v>0?Math.round(100*v/vmax)+'%':'apagado';}

function pinta(d){
 var c=d.rgb, k=function(x){return Math.round(x*255/d.max);};  // 0..max -> 0..255
 sw.style.background='rgb('+k(c[0])+','+k(c[1])+','+k(c[2])+')';
 var b=[br,bg,bb];
 for(var i=0;i<3;i++){b[i].style.width=(100*c[i]/d.max)+'%';}
 // Texto num ritmo humano. Cor e barras acompanham os 30 Hz porque são
 // movimento; dígito trocando 30x/s ninguem le, so treme.
 var t=performance.now();
 if(t-tNum>125){
  tNum=t;
  var v=[vr,vg,vb];
  for(var j=0;j<3;j++){v[j].textContent=c[j];}
  meta.textContent=d.ip+' · '+d.rssi+' dBm · up '+d.up+'s';
 }
 // O servidor manda o brilho 30x/s. Sem esta guarda, cada frame sobrescreveria
 // o slider debaixo do dedo do usuário. Solta o controle 800 ms depois do último
 // toque — cobre mouse, dedo e seta do teclado, sem rastrear ponteiro.
 vmax=d.max;
 sl.max=d.max;
 if(t-tMexeu>800){sl.value=d.brilho;pct.textContent=rotulo(d.brilho);}
}

sl.oninput=function(){
 tMexeu=performance.now();
 pct.textContent=rotulo(+sl.value);
 if(ws&&ws.readyState===1){ws.send(sl.value);}   // texto puro; não vale JSON p/ um int
};

function liga(){
 ws=new WebSocket('ws://'+location.host+'/ws');
 ws.onmessage=function(e){pinta(JSON.parse(e.data));};
 ws.onerror=function(){ws.close();};
 // a placa reinicia bastante durante bring-up; reconectar sozinho evita F5
 ws.onclose=function(){meta.textContent='reconectando...';setTimeout(liga,1000);};
}
liga();
</script></body></html>
