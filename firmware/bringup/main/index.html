<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartFilco — RGB</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;
justify-content:center;align-items:center;gap:2rem;padding:2rem;
background:#12110f;color:#e8e3da;
font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
#sw{width:min(58vw,260px);aspect-ratio:1;border-radius:18px;
border:1px solid #33302b;transition:background .15s linear}
.ch{display:grid;grid-template-columns:1.2rem 3ch 1fr;gap:.55rem .7rem;
align-items:center;width:min(80vw,320px)}
.ch b{font-weight:500;color:#8a8175}
.ch i{font-style:normal;text-align:right;font-size:1.05rem}
.t{height:6px;background:#1e1c19;border-radius:3px;overflow:hidden}
.t>div{height:100%;border-radius:3px;transition:width .15s linear}
.sub{color:#8a8175;font-size:.75rem;letter-spacing:.04em}
.dim{display:grid;grid-template-columns:1fr 7ch;gap:.8rem;align-items:center;
width:min(80vw,320px)}
.dim input{width:100%;accent-color:#e8e3da}
.dim span{color:#8a8175;font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.i2c{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;
width:min(80vw,340px);min-height:1.9rem}
.i2c b{display:inline-flex;align-items:baseline;gap:.4rem;font-weight:400;
background:#1e1c19;border:1px solid #33302b;border-radius:5px;padding:.25rem .5rem;
font-size:.78rem;color:#e8e3da}
.i2c b i{font-style:normal;color:#8a8175;font-size:.72rem}
.i2c .vazio{color:#6b645a;font-size:.75rem;letter-spacing:.04em}
.sens{display:grid;grid-template-columns:auto 1fr;gap:1.5rem;align-items:center;
width:min(80vw,340px)}
.tanque{position:relative;width:78px;height:152px;border:1.5px solid #33302b;
border-radius:7px;overflow:hidden;background:#16140f}
.agua{position:absolute;left:0;right:0;bottom:0;height:0;
background:linear-gradient(#4a8cc4,#26557f);transition:height .3s ease-out}
.agua::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;
background:#8fd0f0}
.tanque b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.1rem;
font-weight:600;color:#e8e3da;text-shadow:0 1px 4px #000,0 0 10px #000}
.tanque.ruim{opacity:.3}
.dados{display:grid;grid-template-columns:1fr auto;gap:.4rem .9rem;font-size:.82rem}
.dados i{font-style:normal;color:#8a8175}
.dados b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums;color:#e8e3da}
.dados .off{color:#5a544c}
</style></head><body>
<div id="sw"></div>
<div class="ch">
<b>R</b><i id="vr">-</i><div class="t"><div id="br" style="background:#d4553f"></div></div>
<b>G</b><i id="vg">-</i><div class="t"><div id="bg" style="background:#6b8e5a"></div></div>
<b>B</b><i id="vb">-</i><div class="t"><div id="bb" style="background:#5a7d9e"></div></div>
</div>
<div class="dim">
<input id="sl" type="range" min="0" max="80" value="80" aria-label="brilho">
<span id="pct">-</span>
</div>
<div class="sens">
<div class="tanque" id="tanque"><div class="agua" id="agua"></div><b id="nivel">-</b></div>
<div class="dados">
<i>distância</i><b id="dist">-</b>
<i>temperatura</i><b id="temp">-</b>
<i>pressão</i><b id="pres">-</b>
<i>umidade</i><b id="umid">-</b>
<i>gás (VOC)</i><b id="gas">-</b>
</div>
</div>
<div class="i2c" id="i2c"></div>
<div class="sub" id="meta">carregando...</div>
<script>
var tNum=0, tMexeu=0, ws=null, vmax=80, i2cAnt='';
// Endereços que o projeto espera. O scan vira verificação, não descoberta:
// faltar um significa fiação, e isso se depura muito mais rápido.
var NOMES={0x29:'VL53L1X',0x48:'ADS1115',0x57:'EEPROM',0x68:'DS3231',
           0x76:'BME680',0x77:'BME680'};
function hex(a){return '0x'+(a<16?'0':'')+a.toString(16);}

// Calibração do reservatório: 4 cm de distância = cheio, 25 cm = vazio.
// O firmware manda milímetros crus; a conversão para nível mora aqui porque é
// geometria do tanque, não física do sensor.
var CHEIO=40, VAZIO=250;
function vazio(el){el.textContent='-';el.classList.add('off');}

function rotulo(v){return v>0?Math.round(100*v/vmax)+'%':'apagado';}

function pinta(d){
 var c=d.rgb, k=function(x){return Math.round(x*255/d.max);};  // 0..max -> 0..255
 sw.style.background='rgb('+k(c[0])+','+k(c[1])+','+k(c[2])+')';
 var b=[br,bg,bb];
 for(var i=0;i<3;i++){b[i].style.width=(100*c[i]/d.max)+'%';}
 // Texto num ritmo humano. Cor e barras acompanham os 30 Hz porque são
 // movimento; dígito trocando 30x/s ninguem le, so treme.
 var t=performance.now();
 if(t-tNum>125){
  tNum=t;
  var v=[vr,vg,vb];
  for(var j=0;j<3;j++){v[j].textContent=c[j];}
  meta.textContent=d.ip+' · '+d.rssi+' dBm · up '+d.up+'s';

  if(d.tof){
   var mm=d.mm, valida=(d.dst===0);
   var pc=Math.max(0,Math.min(100,Math.round(100*(VAZIO-mm)/(VAZIO-CHEIO))));
   agua.style.height=pc+'%';
   nivel.textContent=pc+'%';
   dist.textContent=(mm/10).toFixed(1)+' cm';
   dist.classList.remove('off');
   // status != 0 é medida fraca ou fora de alcance — mostra, mas esmaecida,
   // em vez de sumir com o número e deixar a tela em branco
   tanque.classList.toggle('ruim',!valida);
  }else{
   vazio(dist);vazio(nivel);
  }

  if(d.bme){
   temp.textContent=(d.t/100).toFixed(1)+' °C';
   pres.textContent=(d.pa/100).toFixed(1)+' hPa';
   umid.textContent=(d.rh/100).toFixed(1)+' %';
   // resistência de gás CAI quando há mais VOC. Em kΩ porque ohm cru enche a linha.
   gas.textContent=(d.gas/1000).toFixed(1)+' kΩ';
   [temp,pres,umid,gas].forEach(function(e){e.classList.remove('off');});
  }else{
   vazio(temp);vazio(pres);vazio(umid);vazio(gas);
  }
 }
 // O servidor manda o brilho 30x/s. Sem esta guarda, cada frame sobrescreveria
 // o slider debaixo do dedo do usuário. Solta o controle 800 ms depois do último
 // toque — cobre mouse, dedo e seta do teclado, sem rastrear ponteiro.
 vmax=d.max;
 sl.max=d.max;
 if(t-tMexeu>800){sl.value=d.brilho;pct.textContent=rotulo(d.brilho);}

 // Só redesenha quando a lista muda — plugar/desplugar aparece na hora, mas os
 // 30 frames por segundo não ficam recriando DOM à toa.
 var chave=d.i2c.join(',');
 if(chave!==i2cAnt){
  i2cAnt=chave;
  i2c.innerHTML=d.i2c.length
   ? d.i2c.map(function(a){
       return '<b>'+hex(a)+'<i>'+(NOMES[a]||'?')+'</i></b>';}).join('')
   : '<span class="vazio">I\u00b2C: nenhum dispositivo</span>';
 }
}

sl.oninput=function(){
 tMexeu=performance.now();
 pct.textContent=rotulo(+sl.value);
 if(ws&&ws.readyState===1){ws.send(sl.value);}   // texto puro; não vale JSON p/ um int
};

function liga(){
 ws=new WebSocket('ws://'+location.host+'/ws');
 ws.onmessage=function(e){pinta(JSON.parse(e.data));};
 ws.onerror=function(){ws.close();};
 // a placa reinicia bastante durante bring-up; reconectar sozinho evita F5
 ws.onclose=function(){meta.textContent='reconectando...';setTimeout(liga,1000);};
}
liga();
</script></body></html>
